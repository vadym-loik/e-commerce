<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woo-Commerce</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="#">
                    <img src="assets/logo.svg" alt="logo">
                </a>
            </div>
            <div>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <p>Home</p>
                            <img class="nav-link_icon" src="assets/home.svg" alt="home icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            <p>Products</p>
                            <img class="nav-link_icon" src="assets/products.svg" alt="products icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">
                            <p>Contact Us</p>
                            <img class="nav-link_icon" src="assets/contacts.svg" alt="contacts icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <p>Cart</p>
                            <img class="nav-link_icon" src="assets/cart.svg" alt="cart icon">
                            <span id="cart-count" class="cart-badge" style="display:none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <div class="main">
        <div class="contacts">
            <h1 class="contacts-title">Contact Us</h1>
            <p class="contacts-description">We would love to hear from you! Please fill out the form below or reach us
                at
                our email.</p>

            <form class="contact-form">
                <label for="name">Name:</label>
                <input class="form-input" type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input class="form-input" type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea class="form-input" id="message" name="message" rows="4" required></textarea>

                <button class="contact-btn" type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <ul class="footer-links">
                <li><a class="footer-link" href="#">Privacy Policy</a></li>
                <li><a class="footer-link" href="#">Terms of Service</a></li>
                <li><a class="footer-link" href="#">Contact Us</a></li>
            </ul>
            <p>&copy; <span id="year"></span> Woo-Commerce. All rights reserved.</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="script.js" defer></script>
</body>

</html>
