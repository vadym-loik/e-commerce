<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woo-Commerce</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="#">
                    <img src="assets/logo.svg" alt="logo">
                </a>
            </div>
            <div>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <p>Home</p>
                            <img class="nav-link_icon" src="assets/home.svg" alt="home icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            <p>Products</p>
                            <img class="nav-link_icon" src="assets/products.svg" alt="products icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">
                            <p>Contacts</p>
                            <img class="nav-link_icon" src="assets/contacts.svg" alt="contacts icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <p>Cart</p>
                            <img class="nav-link_icon" src="assets/cart.svg" alt="cart icon">
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <div class="main">
        <div class="cart-container">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <ul id="cart-list"></ul>
            </div>
            <div class="cart-total">
                <p>Total: $<span id="total-price">0.00</span></p>
            </div>
            <div class="cart-actions">
                <button class="cart-btn" id="clear-cart">Clear Cart</button>
                <button class="cart-btn" id="checkout">Checkout</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <ul class="footer-links">
                <li><a class="footer-link" href="#">Privacy Policy</a></li>
                <li><a class="footer-link" href="#">Terms of Service</a></li>
                <li><a class="footer-link" href="contacts.html">Contact Us</a></li>
            </ul>
            <p>&copy; <span id="year"></span> Woo-Commerce. All rights reserved.</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="script.js" defer></script>
</body>

</html>
